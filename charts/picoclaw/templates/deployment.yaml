apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "picoclaw.fullname" . }}
  labels:
    {{- include "picoclaw.labels" . | nindent 4 }}
spec:
  # NOTE: Keep replicas at 1 — running multiple instances against the same
  # channel (e.g. Telegram getUpdates) causes conflicts.
  replicas: {{ .Values.replicaCount }}
  # Recreate strategy: terminate the existing pod completely before starting the
  # replacement. Required for ReadWriteOnce PVCs — RollingUpdate would stall
  # because the new pod cannot attach the volume while the old pod still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "picoclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "picoclaw.configJson" . | sha256sum }}
        checksum/secret: {{ toJson .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "picoclaw.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "picoclaw.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # ---------------------------------------------------------------------------
      # Init container: seeds workspace files from the image and config files
      # from Helm values into the persistent volume.
      #
      # Workspace seeding: runs once — skipped if .seeded sentinel file exists.
      #
      # syncMode: "init"   — copy config only if the file does not yet exist (default)
      #                      manual edits made inside the pod are preserved.
      # syncMode: "always" — always overwrite config from Helm values on every start.
      #                      the ConfigMap/Secret is always the source of truth.
      # ---------------------------------------------------------------------------
      initContainers:
        - name: init
          image: "{{ .Values.image.repository }}:{{ include "picoclaw.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              # --- workspace seed (once) ---
              if [ -f /mnt/workspace/.seeded ]; then
                echo "init: workspace already seeded, skipping"
              elif [ -d /home/picoclaw/.picoclaw/workspace ]; then
                echo "init: seeding workspace files"
                cp -r /home/picoclaw/.picoclaw/workspace/. /mnt/workspace/
                touch /mnt/workspace/.seeded
                echo "init: workspace seeded"
              else
                echo "init: source workspace not found, skipping"
              fi
              # --- config seed ---
              {{- if eq .Values.config.syncMode "always" }}
              echo "init: syncMode=always, overwriting config files"
              cp /tmp/config-tpl/config.json /mnt/picoclaw/config.json
              cp /tmp/security-tpl/.security.yml /mnt/picoclaw/.security.yml
              {{- else }}
              echo "init: syncMode=init, seeding config files only if absent"
              [ -f /mnt/picoclaw/config.json ] || cp /tmp/config-tpl/config.json /mnt/picoclaw/config.json
              [ -f /mnt/picoclaw/.security.yml ] || cp /tmp/security-tpl/.security.yml /mnt/picoclaw/.security.yml
              {{- end }}
              echo "init done"
          volumeMounts:
            - name: data
              mountPath: /mnt/workspace
              subPath: workspace
            - name: data
              mountPath: /mnt/picoclaw
              subPath: home
            - name: config-tpl
              mountPath: /tmp/config-tpl
              readOnly: true
            - name: security-tpl
              mountPath: /tmp/security-tpl
              readOnly: true

      containers:
        - name: picoclaw-gateway
          image: "{{ .Values.image.repository }}:{{ include "picoclaw.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Run picoclaw web UI (accessible at port 18800)
          command: ["picoclaw", "gateway"]
          ports:
            - name: http
              containerPort: {{ .Values.config.gateway.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: PICOCLAW_HOME
              value: "/home/picoclaw/.picoclaw"
            - name: PICOCLAW_CONFIG
              value: "/home/picoclaw/.picoclaw/config.json"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            # Persistent home dir — config.json and .security.yml live here
            - name: data
              mountPath: /home/picoclaw/.picoclaw
              subPath: home
            # Persistent workspace — sessions, memory, cron, etc.
            - name: data
              mountPath: {{ .Values.config.agents.defaults.workspace }}
              subPath: workspace
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        - name: picoclaw-client
          image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          ports:
            - name: client-http
              containerPort: {{ .Values.client.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: client-http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: client-http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: PICOCLAW_GATEWAY_URL
              value: "http://localhost:{{ .Values.config.gateway.port }}"
            - name: PICOCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "picoclaw.clientSecretName" . }}
                  key: gateway-token
            - name: PICOCLAW_DATA_DIR
              value: "/data"
            - name: PICOCLAW_CONFIG
              value: "/picoclaw/config.json"
            - name: PICOCLAW_WORKSPACE_DIR
              value: "/picoclaw/workspace"
            {{- with .Values.client.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.client.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: client
            - name: data
              mountPath: /picoclaw
              subPath: home
            - name: data
              mountPath: /picoclaw/workspace
              subPath: workspace

      volumes:
        # ConfigMap template — read by init container only
        - name: config-tpl
          configMap:
            name: {{ include "picoclaw.configMapName" . }}
        # Security secret template — read by init container only
        - name: security-tpl
          secret:
            secretName: {{ include "picoclaw.securitySecretName" . }}
            items:
              - key: .security.yml
                path: .security.yml
        # Single persistent volume — subPath:home for ~/.picoclaw, subPath:workspace for agent data
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "picoclaw.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
