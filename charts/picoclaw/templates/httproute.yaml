{{- if .Values.client.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "picoclaw.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "picoclaw.labels" . | nindent 4 }}
  {{- with .Values.client.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.client.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.client.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.client.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "picoclaw.fullname" $ }}
          port: {{ $.Values.client.port }}
    {{- end }}
{{- end }}
