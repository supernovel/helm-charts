{{/*
  launcher-secret.yaml — persists PICOCLAW_LAUNCHER_TOKEN across Helm upgrades.

  Token resolution order:
    1. .Values.launcher.token  — explicit value from values.yaml / --set
    2. existing Secret         — reuse the token that was generated on first install
    3. randAlphaNum 32         — generate a fresh random token (first install only)
*/}}
{{- $secretName := include "picoclaw.launcherSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := "" }}
{{- if .Values.launcher.token }}
  {{- $token = .Values.launcher.token }}
{{- else if and $existing $existing.data (index $existing.data "token") }}
  {{- $token = index $existing.data "token" | b64dec }}
{{- else }}
  {{- $token = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "picoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
