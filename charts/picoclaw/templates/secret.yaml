{{/*
  secret.yaml — single source of truth for all sensitive credentials.
  Sections rendered by picoclaw.securityYaml helper:
    model_list     — api_keys per model
    channels       — telegram/discord/slack tokens
    tools.web      — brave/perplexity api_keys
  Mounted read-only; picoclaw deep-merges at startup (config.json wins on conflict).
  Ref: https://docs.picoclaw.io/docs/configuration/config-reference#security-configuration
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "picoclaw.securitySecretName" . }}
  labels:
    {{- include "picoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  .security.yml: |
    {{- include "picoclaw.securityYaml" . | nindent 4 }}
