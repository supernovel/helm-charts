{{/*
  secret.yaml — credential files referenced from config.json via file:// scheme.
  Actual values are copied into /home/picoclaw/.picoclaw/ by the init container;
  picoclaw reads them at startup directly from config.json (no .security.yml).
  Ref: https://docs.picoclaw.io/docs/credential-encryption
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "picoclaw.securitySecretName" . }}
  labels:
    {{- include "picoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- pico gateway token (always present) ---
  pico.token: {{ include "picoclaw.resolvedGatewayToken" . | quote }}
  # --- per-model API keys ---
  {{- range $m := .Values.config.modelList }}
  {{- if $m.apiKey }}
  {{ $m.modelName }}.key: {{ $m.apiKey | quote }}
  {{- end }}
  {{- end }}
  # --- channel tokens ---
  {{- with .Values.config.channels.telegram.token }}
  telegram.token: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.channels.discord.token }}
  discord.token: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.channels.slack.botToken }}
  slack-bot.token: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.channels.slack.appToken }}
  slack-app.token: {{ . | quote }}
  {{- end }}
  # --- web tool keys ---
  {{- with .Values.config.tools.web.brave.apiKey }}
  brave.key: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.tools.web.perplexity.apiKey }}
  perplexity.key: {{ . | quote }}
  {{- end }}
