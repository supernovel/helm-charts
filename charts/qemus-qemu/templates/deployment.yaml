{{/*
Deployment for the qemus/qemu QEMU container.

The container runs QEMU/KVM entirely inside a pod — no KubeVirt required.
On first boot it automatically downloads + installs the configured Linux distribution.

Pod requirements:
  - /dev/kvm device (hardware virtualization)
  - /dev/net/tun device (TUN/TAP networking for VM)
  - privileged pod

Persistent storage:
  - /storage  — VM disk image (standalone PVC: <name>-storage)
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qemus-qemu.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qemus-qemu.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "qemus-qemu.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "qemus-qemu.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: qemu
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BOOT
              value: {{ .Values.vm.boot | quote }}
            - name: CPU_CORES
              value: {{ .Values.vm.cpu | quote }}
            - name: RAM_SIZE
              value: {{ .Values.vm.ram | quote }}
            - name: DISK_SIZE
              value: {{ .Values.vm.diskSize | quote }}
            {{- with .Values.vm.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: console
              containerPort: 8006
              protocol: TCP
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: 22
              protocol: TCP
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: dev-kvm
              mountPath: /dev/kvm
            {{- if .Values.vm.tun }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- end }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "qemus-qemu.fullname" . }}-storage
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
        {{- if .Values.vm.tun }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
