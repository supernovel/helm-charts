{{- if .Values.console.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "qemus-qemu.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qemus-qemu.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.console.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.console.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.console.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.console.httpRoute.rules }}
    - {{- if .matches }}
      matches:
        {{- toYaml .matches | nindent 8 }}
      {{- end }}
      {{- if .filters }}
      filters:
        {{- toYaml .filters | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "qemus-qemu.fullname" $ }}-console
          port: {{ $.Values.console.service.port }}
    {{- end }}
{{- end }}
