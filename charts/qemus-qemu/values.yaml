# Default values for qemus-qemu.
# This is a YAML-formatted file.
#
# Based on: https://github.com/qemus/qemu
#
# Architecture:
#   A single StatefulSet pod runs QEMU/KVM inside a container.
#   The container downloads and installs a Linux distribution automatically,
#   or boots from a custom ISO/image URL.
#
# Requirements:
#   - Kubernetes node with /dev/kvm available (hardware virtualization)
#   - Privileged pod or at minimum: device /dev/kvm + NET_ADMIN capability

# -- Override the chart name
nameOverride: ""
# -- Override the full chart name
fullnameOverride: ""

# ==============================================================================
# VM Configuration
# ==============================================================================
vm:
  # Operating system to install automatically (passed as BOOT env var).
  # Common values:
  #   "mint"        Linux Mint      2.8 GB  (default)
  #   "ubuntu"      Ubuntu Desktop  6.0 GB
  #   "ubuntus"     Ubuntu Server   3.0 GB
  #   "debian"      Debian          3.3 GB
  #   "fedora"      Fedora          2.3 GB
  #   "arch"        Arch Linux      1.2 GB
  #   "alpine"      Alpine Linux    60 MB
  #   "alma"        Alma Linux      2.2 GB
  #   "rocky"       Rocky Linux     2.1 GB
  #   "kali"        Kali Linux      3.8 GB
  #   "nixos"       NixOS           2.4 GB
  #   "centos"      CentOS          7.0 GB
  #
  # Custom image: set boot to a direct download URL (.iso/.img/.qcow2/.vmdk etc.).
  #   boot: "https://example.com/image.iso"
  # Ref: https://github.com/qemus/qemu#how-do-i-select-the-operating-system
  #      https://github.com/qemus/qemu#how-can-i-use-my-own-image
  boot: "mint"

  # CPU cores allocated to the VM
  cpu: 2

  # RAM allocated to the VM (supports K, M, G suffixes)
  ram: "2G"

  # Disk size for the VM installation
  diskSize: "20Gi"

  # Storage class for the PVC (empty = cluster default)
  storageClassName: ""

  # TUN/TAP networking — required for VM network access
  tun: true

  # Additional environment variables passed directly to the container.
  # See https://github.com/qemus/qemu#environment-variables for full list.
  extraEnv: []

# ==============================================================================
# Container Image
# ==============================================================================
image:
  repository: "qemux/qemu"
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ==============================================================================
# noVNC Web Console
#
# Built-in browser-based display: http://<host>:8006
# Provides a web UI to view the VM screen during installation and runtime.
# ==============================================================================
console:
  service:
    type: ClusterIP
    port: 8006
    # nodePort: 38006

  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - vm.example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# ==============================================================================
# SSH Service
#
# Exposes port 22 for SSH access to the guest.
# Requires openssh-server installed in the guest.
# ==============================================================================
ssh:
  enabled: true
  service:
    type: ClusterIP
    port: 22
    # nodePort: 30022

# ==============================================================================
# Resources
# ==============================================================================
resources: {}
  # limits:
  #   cpu: 4
  #   memory: 4Gi
  # requests:
  #   cpu: 1
  #   memory: 2Gi

# ==============================================================================
# Scheduling
# ==============================================================================
nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# ==============================================================================
# Security Context
#
# qemus/qemu requires NET_ADMIN for TUN/TAP networking and /dev/kvm access.
# privileged: true grants all capabilities — use only if NET_ADMIN is insufficient
# for your cluster's configuration.
# Ref: https://github.com/qemus/qemu
# ==============================================================================
podSecurityContext: {}

securityContext:
  privileged: true
  capabilities:
    add:
      - NET_ADMIN
