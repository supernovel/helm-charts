{{/*
ConfigMap holding nginx configuration and a custom index.html for the noVNC proxy.

nginx serves the noVNC static web UI and proxies WebSocket connections to the
kubectl-proxy sidecar, which authenticates requests to the KubeVirt VNC API.

WebSocket flow:
  Browser ──WS──> nginx (/k8s/) ──WS──> kubectl-proxy (127.0.0.1:8001) ──> KubeVirt API ──> VM VNC
*/}}
{{- if .Values.novnc.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "novnc-vm.novncName" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novnc-vm.novncLabels" . | nindent 4 }}
data:
  # nginx configuration:
  #   - Serves noVNC static files from /usr/share/nginx/html
  #   - Proxies /k8s/ requests (including WebSocket upgrades) to kubectl-proxy
  nginx.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Serve noVNC static files
        location / {
            try_files $uri $uri/ =404;
        }

        # Proxy WebSocket and HTTP to kubectl-proxy (KubeVirt VNC API)
        # Strip the /k8s/ prefix before forwarding to the Kubernetes API server
        location /k8s/ {
            proxy_pass         http://127.0.0.1:8001/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       127.0.0.1;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_hide_header  Authorization;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }
    }

  # Custom index.html: auto-redirects to noVNC with the correct VM WebSocket path.
  # The path points to the KubeVirt VNC subresource of this VirtualMachineInstance,
  # routed through the kubectl-proxy at /k8s/.
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>{{ include "novnc-vm.fullname" . }} — VM Console</title>
      <meta http-equiv="refresh" content="0; URL=/vnc.html?path=k8s/apis/subresources.kubevirt.io/v1/namespaces/{{ .Release.Namespace }}/virtualmachineinstances/{{ include "novnc-vm.fullname" . }}/vnc&autoconnect=true&resize=scale&reconnect=true&reconnect_delay=3000">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: #0d1117; color: #c9d1d9;
          display: flex; align-items: center; justify-content: center;
          height: 100vh;
        }
        .card {
          background: #161b22; border: 1px solid #30363d; border-radius: 8px;
          padding: 2rem 2.5rem; text-align: center; max-width: 420px;
        }
        h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #e6edf3; }
        p  { font-size: 0.9rem; color: #8b949e; margin-bottom: 1.5rem; }
        a  {
          display: inline-block;
          background: #238636; color: #fff;
          padding: 0.5rem 1.2rem; border-radius: 6px;
          text-decoration: none; font-size: 0.9rem;
        }
        a:hover { background: #2ea043; }
        .spinner {
          border: 3px solid #30363d; border-top-color: #58a6ff;
          border-radius: 50%; width: 28px; height: 28px;
          animation: spin 0.8s linear infinite;
          margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="spinner"></div>
        <h1>{{ include "novnc-vm.fullname" . }}</h1>
        <p>Connecting to VM console…</p>
        <a href="/vnc.html?path=k8s/apis/subresources.kubevirt.io/v1/namespaces/{{ .Release.Namespace }}/virtualmachineinstances/{{ include "novnc-vm.fullname" . }}/vnc&autoconnect=true&resize=scale&reconnect=true">
          Open Console
        </a>
      </div>
    </body>
    </html>
{{- end }}
