{{- if and .Values.novnc.enabled .Values.novnc.httpRoute.enabled -}}
{{- $svcName := include "novnc-vm.novncName" . -}}
{{- $svcPort := .Values.novnc.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "novnc-vm.novncName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novnc-vm.novncLabels" . | nindent 4 }}
  {{- with .Values.novnc.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.novnc.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.novnc.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.novnc.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
