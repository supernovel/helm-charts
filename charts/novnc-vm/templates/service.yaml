{{- if .Values.novnc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "novnc-vm.novncName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novnc-vm.novncLabels" . | nindent 4 }}
spec:
  type: {{ .Values.novnc.service.type }}
  ports:
    - name: http
      port: {{ .Values.novnc.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "novnc-vm.novncSelectorLabels" . | nindent 4 }}
{{- end }}
