{{/*
KubeVirt VirtualMachine resource.

The VM uses a CDI DataVolume (defined in dataVolumeTemplates) to import the
Debian cloud image via HTTP. Cloud-init configuration is injected via the
NoCloud datasource using an ephemeral cloudinitdisk.

References:
  - https://kubevirt.io/api-reference/
  - https://kubevirt.io/user-guide/virtual_machines/virtual_machine_instances/
*/}}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ include "novnc-vm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novnc-vm.labels" . | nindent 4 }}
spec:
  # VM power state. Set to false to keep the VM stopped after creation.
  running: {{ .Values.vm.running }}

  # Instancetype: CPU and memory are provided by the referenced instancetype object.
  # To override, delete this block and set domain.cpu / domain.memory directly.
  instancetype:
    kind: {{ .Values.vm.instancetype.kind }}
    name: {{ .Values.vm.instancetype.name }}

  {{- if .Values.vm.preference.name }}
  # Preference: guest OS optimizations (disk bus, NIC model, etc.)
  preference:
    kind: {{ .Values.vm.preference.kind }}
    name: {{ .Values.vm.preference.name }}
  {{- end }}

  # DataVolume templates are created and managed alongside the VirtualMachine.
  # CDI will import the disk image from the specified HTTP source URL.
  dataVolumeTemplates:
    - metadata:
        name: {{ include "novnc-vm.fullname" . }}-rootdisk
        labels:
          {{- include "novnc-vm.labels" . | nindent 10 }}
      spec:
        pvc:
          accessModes:
            - {{ .Values.vm.disk.accessMode }}
          resources:
            requests:
              storage: {{ .Values.vm.disk.size }}
          {{- with .Values.vm.disk.storageClassName }}
          storageClassName: {{ . }}
          {{- end }}
        source:
          http:
            url: {{ .Values.vm.disk.imageUrl | quote }}

  template:
    metadata:
      {{- if .Values.vm.clipboard.enabled }}
      annotations:
        hooks.kubevirt.io/hookSidecars: '[{"args": ["--version", "v1alpha3"], "image":"{{ .Values.vm.clipboard.sidecarImage }}", "configMap": {"name": "{{ include "novnc-vm.fullname" . }}-clipboard", "key": "clipboard_hook.sh", "hookPath": "/usr/bin/onDefineDomain"}}]'
      {{- end }}
      labels:
        kubevirt.io/domain: {{ include "novnc-vm.fullname" . }}
        {{- include "novnc-vm.selectorLabels" . | nindent 8 }}
    spec:
      domain:
        devices:
          disks:
            # Root disk from the CDI DataVolume
            - name: rootdisk
              disk:
                bus: virtio
            {{- if .Values.vm.cloudInit.enabled }}
            # Cloud-init configuration disk
            - name: cloudinitdisk
              disk:
                bus: virtio
            {{- end }}
          interfaces:
            - name: default
              {{- if eq .Values.vm.network.type "bridge" }}
              bridge: {}
              {{- else }}
              masquerade: {}
              {{- end }}

      networks:
        - name: default
          pod: {}

      {{- with .Values.vm.evictionStrategy }}
      evictionStrategy: {{ . }}
      {{- end }}

      {{- with .Values.vm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.vm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.vm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        # Root disk: references the CDI DataVolume defined in dataVolumeTemplates
        - name: rootdisk
          dataVolume:
            name: {{ include "novnc-vm.fullname" . }}-rootdisk

        {{- if .Values.vm.cloudInit.enabled }}
        # Cloud-init NoCloud disk: injects user-data at first boot
        - name: cloudinitdisk
          cloudInitNoCloud:
            userDataBase64: {{ .Values.vm.cloudInit.userData | b64enc }}
        {{- end }}
