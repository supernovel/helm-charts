{{- if .Values.novnc.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "novnc-vm.novncName" . }}-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "novnc-vm.novncLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout=10"
        - "http://{{ include "novnc-vm.novncName" . }}:{{ .Values.novnc.service.port }}/"
{{- end }}
