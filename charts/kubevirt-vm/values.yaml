# Default values for kubevirt-vm.
# This is a YAML-formatted file.

# -- Override the chart name
nameOverride: ""
# -- Override the full chart name
fullnameOverride: ""

# ==============================================================================
# VirtualMachine Configuration (KubeVirt)
# Prerequisites:
#   - KubeVirt installed (https://kubevirt.io/)
#   - CDI (Containerized Data Importer) installed for disk image import
# ==============================================================================
vm:
  # Whether the VM should be in running state after deployment
  running: true

  # Instance type — CPU and memory are defined by the VirtualMachineClusterInstancetype
  # Common instancetypes (requires kubevirt/common-instancetypes to be installed):
  #   u1.nano   : 1 vCPU,  512Mi
  #   u1.micro  : 1 vCPU,    1Gi
  #   u1.small  : 1 vCPU,    2Gi
  #   u1.medium : 1 vCPU,    4Gi
  #   u1.large  : 2 vCPU,    8Gi
  #   u1.xlarge : 4 vCPU,   16Gi
  #   u1.2xlarge: 8 vCPU,   32Gi
  # Ref: https://github.com/kubevirt/common-instancetypes
  instancetype:
    # VirtualMachineClusterInstancetype (cluster-scoped) or VirtualMachineInstancetype (namespace-scoped)
    kind: VirtualMachineClusterInstancetype
    name: u1.nano

  # Preference — defines guest OS optimizations (disk bus, network model, etc.).
  # Leave name empty to skip.
  preference:
    kind: VirtualMachineClusterPreference
    name: "debian"

  # Root disk configuration (backed by a CDI DataVolume)
  disk:
    # Root disk size
    size: "10Gi"
    # Storage class for the DataVolume PVC (empty = cluster default)
    storageClassName: ""
    # PVC access mode: ReadWriteOnce or ReadWriteMany (for live migration)
    accessMode: "ReadWriteOnce"
    # Debian 12 (Bookworm) generic cloud image URL
    # CDI will import this image via HTTP during DataVolume creation
    imageUrl: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"

  # Cloud-init configuration injected via NoCloud datasource
  cloudInit:
    enabled: true
    # Guest OS user created at first boot
    user:
      name: debian
      # Plain-text password (change in production!)
      password: debian
    # Additional packages to install alongside qemu-guest-agent.
    # Note: tigervnc-standalone-server is added automatically when novnc.guest.enabled=true.
    #       openssh-server is pre-installed in Debian cloud images (webssh.enabled requires no extra package).
    packages: []
      # - some-extra-package
    # Additional runcmd entries run after qemu-guest-agent activation.
    # Note: vncserver@:1 is enabled automatically when novnc.guest.enabled=true.
    runcmd: []
      # - some-extra-command

  # Network interface type
  # masquerade: NAT-based networking using the pod network (recommended)
  # bridge:     Direct bridge networking (requires NetworkAttachmentDefinition)
  network:
    type: masquerade

  # Eviction strategy for node maintenance / live migration
  # LiveMigrate: migrate VM to another node instead of shutting down
  # None: do not evict
  evictionStrategy: "LiveMigrate"

  # VM pod scheduling constraints
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ==============================================================================
# noVNC Web Console Configuration
#
# Two separate Deployments, each with nginx + a dedicated sidecar:
#
#   novnc.guest.enabled — novnc-deployment.yaml
#     websockify sidecar: WebSocket → VM Service → in-guest VNC
#     Exposed via Service + HTTPRoute (user-facing). Full clipboard support.
#     Requires: in-guest VNC server in the VM (add to cloudInit.packages).
#
#   novnc.admin.enabled  — admin-novnc-deployment.yaml
#     kubectl-proxy sidecar: nginx (/k8s/) → KubeVirt VNC subresource API
#     Admin/debug access only. NO Service attached — use kubectl port-forward.
#
# ==============================================================================
novnc:
  # QEMU VNC console — kubectl-proxy sidecar + /k8s/ nginx path
  # Admin/debug access via KubeVirt subresource API.
  # Runs in a dedicated pod (admin-novnc-deployment.yaml) with NO Service attached.
  # Access: kubectl port-forward pod/<pod> 8080:8080
  admin:
    enabled: true

  # In-guest VNC console — websockify sidecar + /websockify nginx path
  # Primary user-facing access.
  # Requires: in-guest VNC server in the VM (e.g. add tigervnc-standalone-server to cloudInit.packages).
  guest:
    enabled: false

  # noVNC release version downloaded from GitHub at pod startup
  # Ref: https://github.com/novnc/noVNC/releases
  version: "1.4.0"

  # Container images
  image:
    # kubectl proxy sidecar: authenticates requests to the KubeVirt VNC API
    proxy:
      repository: "rancher/kubectl"
      tag: "v1.34.5"
      pullPolicy: IfNotPresent
    # nginx: serves noVNC static files and proxies WebSocket to KubeVirt
    server:
      repository: "nginx"
      tag: "1.28.2-alpine-perl"
      pullPolicy: IfNotPresent
    # Init container: downloads noVNC static files from GitHub at pod start
    init:
      repository: "alpine"
      tag: "3.19"
      pullPolicy: IfNotPresent
    # websockify: WebSocket-to-TCP bridge, used when mode=vnc
    # Ref: https://github.com/novnc/websockify
    websockify:
      repository: "supernovel/novnc-websockify"
      tag: "v0.13.0"
      pullPolicy: IfNotPresent

  # Image pull secrets for private registries
  imagePullSecrets: []

  # Service configuration for the noVNC web UI
  service:
    # ClusterIP, NodePort, or LoadBalancer
    type: ClusterIP
    port: 8080

  # Gateway API HTTPRoute for external access to the noVNC console.
  # Requires: Gateway API CRDs and a compatible Gateway controller
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
        # namespace: default
    hostnames:
      - kubevirt-vm.example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  # Resource limits for noVNC containers (kubectl-proxy + nginx)
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Additional pod annotations and labels for the noVNC deployment
  podAnnotations: {}
  podLabels: {}

  # noVNC pod scheduling constraints
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # ---------------------------------------------------------------------------
  # RBAC — ServiceAccount for the kubectl-proxy sidecar (novnc.admin.enabled)
  # Granted read access to VirtualMachineInstance VNC subresource.
  # ---------------------------------------------------------------------------
  serviceAccount:
    # Create a dedicated ServiceAccount
    create: true
    # Annotations (e.g., for IRSA / Workload Identity)
    annotations: {}
    # Name override; defaults to the chart fullname if empty
    name: ""
    # Automount the ServiceAccount API token into the pod
    automount: true

# ==============================================================================
# Web SSH Terminal (webssh)
#
# Deploys a wetty web terminal that connects to the VM's SSH port via the
# cluster-internal VM Service.  Requires openssh-server in the VM guest
# (add to cloudInit.packages).
#
# Architecture:
#   Browser → wetty (web terminal) → VM Service (port 22) → guest sshd
# ==============================================================================
webssh:
  # Enable the web SSH terminal
  enabled: false

  image:
    repository: "ghcr.io/butlerx/wetty"
    tag: "2.5"
    pullPolicy: IfNotPresent

  # Default SSH user for the wetty UI.
  # Empty string defaults to vm.cloudInit.user.name at render time.
  sshUser: ""

  # Service configuration
  service:
    type: ClusterIP
    port: 3000

  # Gateway API HTTPRoute for external access to the web SSH terminal.
  # Requires: Gateway API CRDs and a compatible Gateway controller
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - ssh.kubevirt-vm.example.com
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 50m
    #   memory: 128Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
