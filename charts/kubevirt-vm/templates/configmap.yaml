{{/*
Guest noVNC ConfigMap — nginx config for the guest VNC pod (novnc-deployment.yaml).

Port 8080 (public — Service + HTTPRoute):
  /                → noVNC static files
  /websockify      → websockify:6080 → VM Service → in-guest VNC

QEMU VNC config is in a separate ConfigMap — see admin-novnc-deployment.yaml.
*/}}
{{- if .Values.novnc.guest.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubevirt-vm.consoleName" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.consoleLabels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ =404;
        }

        # In-guest VNC — websockify bridge. Full clipboard support.
        location /websockify {
            proxy_pass         http://127.0.0.1:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       127.0.0.1;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>{{ include "kubevirt-vm.fullname" . }} — VM Console</title>
      <meta http-equiv="refresh" content="0; URL=/vnc.html?path=websockify&autoconnect=true&resize=scale&reconnect=true&reconnect_delay=3000">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: #0d1117; color: #c9d1d9;
          display: flex; align-items: center; justify-content: center;
          height: 100vh;
        }
        .card {
          background: #161b22; border: 1px solid #30363d; border-radius: 8px;
          padding: 2rem 2.5rem; text-align: center; max-width: 420px;
        }
        h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #e6edf3; }
        p  { font-size: 0.9rem; color: #8b949e; margin-bottom: 1.5rem; }
        .links { display: flex; flex-direction: column; gap: 0.5rem; }
        a  {
          display: inline-block;
          background: #238636; color: #fff;
          padding: 0.5rem 1.2rem; border-radius: 6px;
          text-decoration: none; font-size: 0.9rem;
        }
        a:hover { filter: brightness(1.15); }
        .spinner {
          border: 3px solid #30363d; border-top-color: #58a6ff;
          border-radius: 50%; width: 28px; height: 28px;
          animation: spin 0.8s linear infinite;
          margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="spinner"></div>
        <h1>{{ include "kubevirt-vm.fullname" . }}</h1>
        <p>Connecting to VM console…</p>
        <div class="links">
          <a href="/vnc.html?path=websockify&autoconnect=true&resize=scale&reconnect=true">
            Open Console (in-guest VNC)
          </a>
        </div>
      </div>
    </body>
    </html>
{{- end }}
---
{{/*
Admin noVNC ConfigMap — nginx config for the QEMU VNC pod (admin-novnc-deployment.yaml).

Port 8080 (admin — no Service attached, port-forward only):
  /                → noVNC static files
  /k8s/            → kubectl-proxy:8001 → KubeVirt API → QEMU VNC
*/}}
{{- if .Values.novnc.admin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubevirt-vm.adminConsoleName" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.adminConsoleLabels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ =404;
        }

        # QEMU VNC — kubectl-proxy (KubeVirt subresource API). Admin access only.
        location /k8s/ {
            proxy_pass         http://127.0.0.1:8001/;
            proxy_http_version 1.1;
            proxy_set_header   Authorization "";
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       127.0.0.1;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>{{ include "kubevirt-vm.fullname" . }} — QEMU VNC (Admin)</title>
      <meta http-equiv="refresh" content="0; URL=/vnc.html?path=k8s/apis/subresources.kubevirt.io/v1/namespaces/{{ .Release.Namespace }}/virtualmachineinstances/{{ include "kubevirt-vm.fullname" . }}/vnc&autoconnect=true&resize=scale&reconnect=true&reconnect_delay=3000">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: #0d1117; color: #c9d1d9;
          display: flex; align-items: center; justify-content: center;
          height: 100vh;
        }
        .card {
          background: #161b22; border: 1px solid #30363d; border-radius: 8px;
          padding: 2rem 2.5rem; text-align: center; max-width: 420px;
        }
        h1 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #e6edf3; }
        p  { font-size: 0.9rem; color: #8b949e; margin-bottom: 1.5rem; }
        .links { display: flex; flex-direction: column; gap: 0.5rem; }
        a  {
          display: inline-block;
          background: #1f6feb; color: #fff;
          padding: 0.5rem 1.2rem; border-radius: 6px;
          text-decoration: none; font-size: 0.9rem;
        }
        a:hover { filter: brightness(1.15); }
        .badge {
          display: inline-block; background: #b08800; color: #fff;
          font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px;
          margin-bottom: 0.8rem; letter-spacing: 0.05em;
        }
        .spinner {
          border: 3px solid #30363d; border-top-color: #58a6ff;
          border-radius: 50%; width: 28px; height: 28px;
          animation: spin 0.8s linear infinite;
          margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="spinner"></div>
        <span class="badge">ADMIN</span>
        <h1>{{ include "kubevirt-vm.fullname" . }}</h1>
        <p>Connecting to QEMU VNC console…</p>
        <div class="links">
          <a href="/vnc.html?path=k8s/apis/subresources.kubevirt.io/v1/namespaces/{{ .Release.Namespace }}/virtualmachineinstances/{{ include "kubevirt-vm.fullname" . }}/vnc&autoconnect=true&resize=scale&reconnect=true">
            Open QEMU Console
          </a>
        </div>
      </div>
    </body>
    </html>
{{- end }}
