{{- if and .Values.webssh.enabled .Values.webssh.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kubevirt-vm.fullname" . }}-webssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.labels" . | nindent 4 }}
    app.kubernetes.io/component: webssh
  {{- with .Values.webssh.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.webssh.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.webssh.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.webssh.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "kubevirt-vm.fullname" $ }}-webssh
          port: {{ $.Values.webssh.service.port }}
    {{- end }}
{{- end }}
