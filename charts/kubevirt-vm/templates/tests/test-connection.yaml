{{- if .Values.novnc.guest.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kubevirt-vm.consoleName" . }}-novnc-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.consoleLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout=10"
        - "http://{{ include "kubevirt-vm.consoleName" . }}:{{ .Values.novnc.service.port }}/"
{{- end }}
{{- if .Values.webssh.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kubevirt-vm.fullname" . }}-webssh-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.labels" . | nindent 4 }}
    app.kubernetes.io/component: webssh
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout=10"
        - "http://{{ include "kubevirt-vm.fullname" . }}-webssh:{{ .Values.webssh.service.port }}/"
{{- end }}
