{{/*
Deployment for the guest noVNC web console (novnc.guest.enabled).

Pod contains:
  1. init/download-novnc  — Downloads noVNC static files from GitHub into a shared volume.
  2. websockify           — WebSocket-to-TCP bridge on 127.0.0.1:6080 → VM Service → in-guest VNC.
                            Requires novnc.guest.enabled=true + VNC server running in the VM (port 5900).
  3. novnc-server (nginx) — Serves noVNC static files + proxies /websockify → websockify:6080.
                            Listens on port 8080. Exposed via Service + HTTPRoute.

Connection flow:
  Browser ──WS──> nginx (/websockify) ──WS──> websockify:6080 ──TCP──> VM Service ──> guest VNC

QEMU VNC (admin access) is in a separate pod — see admin-novnc-deployment.yaml.
*/}}
{{- if .Values.novnc.guest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubevirt-vm.consoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.consoleLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubevirt-vm.consoleSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.novnc.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubevirt-vm.consoleLabels" . | nindent 8 }}
        {{- with .Values.novnc.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.novnc.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubevirt-vm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.novnc.serviceAccount.automount }}

      initContainers:
        - name: download-novnc
          image: "{{ .Values.novnc.image.init.repository }}:{{ .Values.novnc.image.init.tag }}"
          imagePullPolicy: {{ .Values.novnc.image.init.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              NOVNC_VERSION="{{ .Values.novnc.version }}"
              echo "Downloading noVNC v${NOVNC_VERSION} ..."
              wget -q -O /tmp/novnc.tar.gz \
                "https://github.com/novnc/noVNC/archive/refs/tags/v${NOVNC_VERSION}.tar.gz"
              tar -xzf /tmp/novnc.tar.gz -C /tmp/
              cp -r "/tmp/noVNC-${NOVNC_VERSION}/." /novnc/
              echo "noVNC ready."
          volumeMounts:
            - name: novnc-files
              mountPath: /novnc

      containers:
        # -------------------------------------------------------------------
        # websockify: WebSocket-to-TCP bridge → in-guest VNC server
        # Requires novnc.guest.enabled=true (VM Service must exist, guest VNC on port 5900).
        # -------------------------------------------------------------------
        - name: websockify
          image: "{{ .Values.novnc.image.websockify.repository }}:{{ .Values.novnc.image.websockify.tag }}"
          imagePullPolicy: {{ .Values.novnc.image.websockify.pullPolicy }}
          command:
            - websockify
            - "6080"
            - {{ printf "%s-vm.%s.svc.cluster.local:5900" (include "kubevirt-vm.fullname" .) .Release.Namespace | quote }}
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: novnc-files
              mountPath: /novnc

        # -------------------------------------------------------------------
        # nginx: noVNC static files + /websockify proxy
        # Port 8080 — exposed via Service + HTTPRoute.
        # -------------------------------------------------------------------
        - name: novnc-server
          image: "{{ .Values.novnc.image.server.repository }}:{{ .Values.novnc.image.server.tag }}"
          imagePullPolicy: {{ .Values.novnc.image.server.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          {{- with .Values.novnc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: novnc-files
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: novnc-index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: novnc-files
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ include "kubevirt-vm.consoleName" . }}-config
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: novnc-index
          configMap:
            name: {{ include "kubevirt-vm.consoleName" . }}-config
            items:
              - key: index.html
                path: index.html
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      {{- with .Values.novnc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.novnc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.novnc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
