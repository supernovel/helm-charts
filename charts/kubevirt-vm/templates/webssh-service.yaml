{{- if .Values.webssh.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubevirt-vm.fullname" . }}-webssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-vm.labels" . | nindent 4 }}
    app.kubernetes.io/component: webssh
spec:
  type: {{ .Values.webssh.service.type }}
  ports:
    - name: http
      port: {{ .Values.webssh.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kubevirt-vm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webssh
{{- end }}
