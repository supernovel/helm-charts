{{- if .Values.adminNovnc.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubevirt-windows-vm.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-windows-vm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubevirt-windows-vm.fullname" . }}-console
subjects:
  - kind: ServiceAccount
    name: {{ include "kubevirt-windows-vm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
