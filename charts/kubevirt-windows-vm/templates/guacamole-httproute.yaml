{{- if and .Values.rdp.enabled .Values.rdp.guacamole.httpRoute.enabled -}}
{{- $svcName := include "kubevirt-windows-vm.guacamoleName" . -}}
{{- $svcPort := .Values.rdp.guacamole.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kubevirt-windows-vm.guacamoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubevirt-windows-vm.guacamoleLabels" . | nindent 4 }}
  {{- with .Values.rdp.guacamole.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.rdp.guacamole.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.rdp.guacamole.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.rdp.guacamole.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
