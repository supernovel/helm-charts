image:
  repository: ghcr.io/get-convex/convex-dashboard
  pullPolicy: IfNotPresent
  tag: "6efab6f2b6c182b90255774d747328cfc7b80dd9"
imagePullSecrets: []
replicaCount: 1
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations: {}
podSecurityContext: {}
  # fsGroup: 2000
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
service:
  type: ClusterIP
  port: 6791
environment: []
ingress:
  enabled: true
  className: "traefik" # Set to "nginx" if using NGINX Ingress Controller
  annotations: {}
  tls: ""
  host: dashboard.example.com
volumeMounts: {}
#   - name: volume_name
#     mountPath: /path/to/my/secret
volumes: {}
#   - name: volume_name
#     secret:
#       defaultMode: 733
#       secretName: my_secret
#       items:
#       - key: my_secret.txt
#         path: name_of_file_in_container.txt
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}